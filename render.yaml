services:
  - type: web
    name: devforge-student-support-agent
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OLLAMAAPIKEY
        sync: false
      - key: OLLAMA_MODEL
        value: qwen2.5
      - key: OLLAMA_HOST
        value: https://ollama.com
      - key: PYTHON_VERSION
        value: 3.11.9
